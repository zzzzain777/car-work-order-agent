spring:
  application:
    name: car-work-order-agent
  # Database auto-configuration stays off until the explicit RAG/task-store profile is ready.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  profiles:
    default: local
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health
