spring:
  application:
    name: car-work-order-agent
  # 默认不创建数据库连接；只有主动启用政策检索配置时才连接本地数据库。
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
  profiles:
    default: local
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: 8091

management:
  endpoints:
    web:
      exposure:
        include: health
