# 仅在显式启用 bailian-embedding Profile 时接入百炼向量模型。
# Base URL 与 API Key 放在 Git 忽略的 ./config/application-bailian-embedding.yml。
spring:
  ai:
    model:
      embedding: openai
    openai:
      embedding:
        embeddings-path: /embeddings
        options:
          model: qwen3.7-text-embedding-flash
